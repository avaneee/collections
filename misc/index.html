<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="misc.css">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <title>my collection | miscellaneous</title>
</head>

<body>
    <div class="bg"></div>
    <div class="nav-parent">
        <a class="homepage" href="../index.html">home</a>
        <div class="spacer"></div>
        <a class="homepage" href="../postcard/index.html">postcards</a>
        <a class="homepage" href="../magnet/index.html">magnets</a>
        <a class="homepage" href="../misc/index.html">misc</a>
        <a class="homepage" href="../inventory/index.html">inventory</a>
    </div>

    <div class="sort-wrap">
        <div id="item-area">
            <div id="drag-card" class="item-card" draggable="true">
                <img id="card-img" src="" alt="" />
                <div id="card-name"></div>
                <div id="card-meta"></div>
            </div>
        </div>

        <div id="status" class="status-msg"></div>

        <div class="trays-row">
            <div class="tray" id="tray-tickets" data-tray="tickets">
                <div class="tray-label">tickets</div>
                <div class="tray-empty" id="empty-tickets">drop here</div>
            </div>
            <div class="tray" id="tray-receipts" data-tray="receipts">
                <div class="tray-label">receipts</div>
                <div class="tray-empty" id="empty-receipts">drop here</div>
            </div>
            <div class="tray" id="tray-misc" data-tray="misc">
                <div class="tray-label">actually misc</div>
                <div class="tray-empty" id="empty-misc">drop here</div>
            </div>
        </div>

        <div id="summary" class="summary-panel" style="display:none;"></div>
    </div>

    <script src="../data.js"></script>
    <script src="misc.js"></script>
</body>

</html>
